name: Apply pinned Dart formatter

on:
  push:
    branches:
      - feat/giw-desktop-control-plane

permissions:
  contents: write

env:
  FLUTTER_REVISION: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/giw-desktop-control-plane
          persist-credentials: true
      - name: Install pinned official Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "$FLUTTER_REVISION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach FETCH_HEAD
      - name: Resolve packages exactly as CI does
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/flutter/bin/flutter" pub get
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/flutter/bin/dart" format lib
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git commit -m 'style: apply pinned dart format'
          git push origin HEAD:feat/giw-desktop-control-plane
