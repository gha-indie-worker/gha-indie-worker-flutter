name: Format Flutter feature branch

on:
  push:
    branches:
      - feat/giw-desktop-control-plane

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/giw-desktop-control-plane
          persist-credentials: true
      - name: Install official Flutter stable SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Format Dart
        shell: bash
        run: |
          set -euo pipefail
          dart format lib
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          git commit -m 'style: apply dart format'
          git push origin HEAD:feat/giw-desktop-control-plane
