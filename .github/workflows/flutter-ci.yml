name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.5
  FLUTTER_REVISION: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned official Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/flutter"
          git -C "$RUNNER_TEMP/flutter" remote add origin https://github.com/flutter/flutter.git
          git -C "$RUNNER_TEMP/flutter" fetch --depth 1 origin "refs/tags/$FLUTTER_VERSION:refs/tags/$FLUTTER_VERSION"
          git -C "$RUNNER_TEMP/flutter" checkout --detach "$FLUTTER_VERSION"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Show toolchain versions
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/flutter/bin/flutter" --version
          "$RUNNER_TEMP/flutter/bin/dart" --version
      - name: Resolve packages
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/flutter/bin/flutter" pub get
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/flutter/bin/dart" format lib test
          git diff --exit-code -- lib test
      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/flutter/bin/flutter" analyze
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/flutter/bin/flutter" test --no-pub
